name: Build profile visualizers

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visualizers
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Prepare output directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist profile-3d-contrib crawl trophy repository-contribution-stats galaxy-profile readme-repo-pins-src repo-pins-work space-shooter github-profile-svg github-poster
          mkdir -p dist/profile-3d-contrib

      - name: Generate contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.3.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate snake and commits
        uses: dahan8473/snake-and-commits@c55d1f1668e849195f395a9d93c56e74b68aaac2 # v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake.svg
          theme: green

      - name: Generate Pac-Man graph
        uses: abozanona/pacman-contribution-graph@d258e3fb01511c1ff4fe6418408ede37b2ad4935
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Generate Breakout graph
        uses: cyprieng/github-breakout@60c43dca3a1361fbc9fb9bb533b5193296345c4f
        with:
          github_username: ${{ github.repository_owner }}
          output_path: dist

      - name: Check out Contribution Crawl
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          repository: MaskiCoding/Contribution-Crawl
          ref: 6010bdeffccd24d871600b9dfa9f9e75877d3af9
          path: crawl

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crawl/package-lock.json

      - name: Generate Contribution Crawl
        working-directory: crawl
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          node dist/index.js "${{ github.repository_owner }}" ..

      - name: Collect Contribution Crawl assets
        shell: bash
        run: |
          set -euo pipefail
          mv contribution-crawl-light.svg dist/
          mv contribution-crawl-dark.svg dist/

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D assets
        shell: bash
        run: |
          set -euo pipefail
          cp -R profile-3d-contrib/. dist/profile-3d-contrib/

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # pinned 2026-07-31
        with:
          filename: metrics.svg
          output_action: none
          token: ${{ github.token }}
          template: classic
          config_timezone: Europe/Berlin

      - name: Collect GitHub Metrics
        run: sudo cp /metrics_renders/metrics.svg dist/metrics.svg

      - name: Check out GitHub Profile Trophy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          repository: ryo-ma/github-profile-trophy
          ref: e3c89df995e92e67cdd4b2acaab9d974583dc1f7
          path: trophy

      - name: Set up Deno for GitHub Profile Trophy
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1
        with:
          deno-version: v1.x

      - name: Generate GitHub Profile Trophy
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ github.token }}
        run: |
          set -euo pipefail
          deno run --allow-net --allow-env --allow-read --allow-write trophy/render_svg.ts "${{ github.repository_owner }}" dist/github-profile-trophy.svg flat

      - name: Generate Maeul in the Sky
        uses: t1seo/maeul-in-the-sky@e308d35ed2311502f44e557a93ab167de9922f5b # pinned 2026-07-31
        with:
          github_token: ${{ github.token }}
          output_dir: ./dist

      - name: Generate ghstats cards
        uses: tiennm99/ghstats@9f7c16f8357e8a26eada9a9652db7701c3ec5753 # pinned 2026-07-31
        with:
          user: ${{ github.repository_owner }}
          token: ${{ github.token }}
          out: dist/ghstats
          themes: dracula,github_dark,tokyonight
          include_private: 'false'
          commit_changes: 'false'

      - name: Generate GitHub Gravity
        uses: flycran/github-gravity@ea8d6643dfd97df88c2b8d7505f713df91cc45b8 # pinned 2026-07-31
        with:
          username: ${{ github.repository_owner }}
          text: ${{ github.repository_owner }}
          output-path: dist/github-gravity.svg

      - name: Generate User Statistician
        uses: cicirello/user-statistician@f44e0aaf18447f3923eca30b6caa7d0b9fe84213
        with:
          image-file: dist/user-statistician.svg
          commit-and-push: false
          colors: dark
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out Repository Contribution Stats
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: HwangTaehyun/github-repository-contribution-stats
          ref: 95a90818c685ac6487d10750fbfc42bcdc5ef14f
          path: repository-contribution-stats

      - name: Generate Repository Contribution Stats
        shell: bash
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
          INPUT_USERNAME: ${{ github.repository_owner }}
          INPUT_OUTPUT-FILE: dist/github-repository-contribution-stats.svg
          INPUT_COMBINE-ALL-YEARLY-CONTRIBUTIONS: 'true'
          INPUT_HIDE-CONTRIBUTOR-RANK: 'true'
          INPUT_LIMIT: '6'
          INPUT_THEME: github_dark
        run: node repository-contribution-stats/action/dist/index.js

      - name: Check out Galaxy Profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: vinimlo/galaxy-profile
          ref: 5d4be766b4f9b76da9b7c6d9172fa6ba705e9b75
          path: galaxy-profile

      - name: Set up Python for Galaxy Profile
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: galaxy-profile/requirements.txt

      - name: Generate Galaxy Profile
        working-directory: galaxy-profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          cp config.example.yml config.yml
          sed -i "s/^username: galaxy-dev/username: ${{ github.repository_owner }}/" config.yml
          python -m generator.main
          mkdir -p ../dist/galaxy-profile
          cp assets/generated/*.svg ../dist/galaxy-profile/

      - name: Check out Profile Repository Pins source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: profile-icons/readme-repo-pins-src
          ref: bcd154073916acc3205c42b08b4b28d1c9aaa1c4
          path: readme-repo-pins-src

      - name: Set up Python for Profile Repository Pins
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Generate public Profile Repository Pins
        env:
          GH_API_TOKEN: ${{ github.token }}
          GH_USERNAME: ${{ github.repository_owner }}
          GH_REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          pip install -r readme-repo-pins-src/requirements.txt
          mkdir -p repo-pins-work
          cp -R readme-repo-pins-src/. repo-pins-work/
          (cd repo-pins-work && python gh_profile_repo_pins.py)
          mkdir -p dist/profile-repo-pins
          cp repo-pins-work/imgs/*.svg dist/profile-repo-pins/

      - name: Check out Space Shooter source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: czl9707/gh-space-shooter
          ref: 6b945979b0cf53e7887e62d32fddcdb5bccbed89
          path: space-shooter

      - name: Set up Python for Space Shooter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Generate Space Shooter
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pip install ./space-shooter
          mkdir -p dist
          gh-space-shooter "${{ github.repository_owner }}" --output dist/github-space-shooter.gif --strategy random --fps 20

      - name: Check out GitHub Profile SVG source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Axxel-L/github-profile-svg
          ref: 0c2d082bc8151d12f61c740369c52fa8eea5741a
          path: github-profile-svg

      - name: Generate GitHub Profile SVG
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t github-profile-svg >/tmp/github-profile-svg.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --get --data-urlencode "username=${{ github.repository_owner }}" http://127.0.0.1:8080/api/generate.php -o dist/github-profile-svg.svg; then
              break
            fi
            sleep 2
          done

      - name: Check out GitHubPoster source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: yihong0618/GitHubPoster
          ref: 61691ee19032e43bdb4277096279b304c2b9ad44
          path: github-poster

      - name: Set up Python for GitHubPoster
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Generate GitHubPoster
        working-directory: github-poster
        shell: bash
        run: |
          set -euo pipefail
          pip install .
          python -m github_poster github --github_user_name "${{ github.repository_owner }}" --year 2025-2026 --with-animation
          mkdir -p ../dist
          cp OUT_FOLDER/github.svg ../dist/github-poster.svg

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            dist/github-snake.svg \
            dist/github-snake-dark.svg \
            dist/snake.svg \
            dist/pacman-contribution-graph.svg \
            dist/light.svg \
            dist/dark.svg \
            dist/contribution-crawl-light.svg \
            dist/contribution-crawl-dark.svg \
            dist/profile-3d-contrib/profile-night-rainbow.svg \
            dist/metrics.svg \
            dist/github-profile-trophy.svg \
            dist/maeul-in-the-sky-dark.svg \
            dist/maeul-in-the-sky-light.svg \
            dist/ghstats/dracula/stats.svg \
            dist/ghstats/github_dark/stats.svg \
            dist/ghstats/tokyonight/stats.svg \
            dist/github-gravity.svg \
            dist/user-statistician.svg \
            dist/github-repository-contribution-stats.svg \
            dist/galaxy-profile/galaxy-header.svg \
            dist/profile-repo-pins/0.svg \
            dist/github-space-shooter.gif \
            dist/github-profile-svg.svg \
            dist/github-poster.svg; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing or empty generated asset: $asset"
              ls -l "$asset" || true
              exit 1
            fi
            echo "Verified $asset ($(wc -c < "$asset") bytes)"
          done

      - name: Publish all assets to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
