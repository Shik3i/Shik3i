name: Build profile visualizers

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visualizers
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2

      - name: Prepare output directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist profile-3d-contrib crawl trophy
          mkdir -p dist/profile-3d-contrib

      - name: Generate contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.3.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate snake and commits
        uses: dahan8473/snake-and-commits@c55d1f1668e849195f395a9d93c56e74b68aaac2 # v1
        with:
          github_user: ${{ github.repository_owner }}
          output: dist/snake.svg
          theme: green

      - name: Generate Pac-Man graph
        uses: abozanona/pacman-contribution-graph@d258e3fb01511c1ff4fe6418408ede37b2ad4935
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Generate Breakout graph
        uses: cyprieng/github-breakout@60c43dca3a1361fbc9fb9bb533b5193296345c4f
        with:
          github_username: ${{ github.repository_owner }}
          output_path: dist

      - name: Check out Contribution Crawl
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          repository: MaskiCoding/Contribution-Crawl
          ref: 6010bdeffccd24d871600b9dfa9f9e75877d3af9
          path: crawl

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crawl/package-lock.json

      - name: Generate Contribution Crawl
        working-directory: crawl
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run build
          node dist/index.js "${{ github.repository_owner }}" ..

      - name: Collect Contribution Crawl assets
        shell: bash
        run: |
          set -euo pipefail
          mv contribution-crawl-light.svg dist/
          mv contribution-crawl-dark.svg dist/

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect 3D assets
        shell: bash
        run: |
          set -euo pipefail
          cp -R profile-3d-contrib/. dist/profile-3d-contrib/

      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d # pinned 2026-07-31
        with:
          filename: dist/metrics.svg
          token: ${{ github.token }}
          template: classic
          config_timezone: Europe/Berlin

      - name: Check out GitHub Profile Trophy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          repository: ryo-ma/github-profile-trophy
          ref: e3c89df995e92e67cdd4b2acaab9d974583dc1f7
          path: trophy

      - name: Set up Deno for GitHub Profile Trophy
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d # v1
        with:
          deno-version: v1.x

      - name: Generate GitHub Profile Trophy
        shell: bash
        env:
          GITHUB_TOKEN1: ${{ github.token }}
        run: |
          set -euo pipefail
          deno run --allow-net --allow-env --allow-read --allow-write trophy/render_svg.ts "${{ github.repository_owner }}" dist/github-profile-trophy.svg flat

      - name: Generate Maeul in the Sky
        uses: t1seo/maeul-in-the-sky@e308d35ed2311502f44e557a93ab167de9922f5b # pinned 2026-07-31
        with:
          github_token: ${{ github.token }}
          output_dir: ./dist

      - name: Generate ghstats cards
        uses: tiennm99/ghstats@9f7c16f8357e8a26eada9a9652db7701c3ec5753 # pinned 2026-07-31
        with:
          user: ${{ github.repository_owner }}
          token: ${{ github.token }}
          out: dist/ghstats
          themes: dracula,github_dark,tokyonight
          include_private: 'false'
          commit_changes: 'false'

      - name: Generate GitHub Gravity
        uses: flycran/github-gravity@ea8d6643dfd97df88c2b8d7505f713df91cc45b8 # pinned 2026-07-31
        with:
          username: ${{ github.repository_owner }}
          text: ${{ github.repository_owner }}
          output-path: dist/github-gravity.svg

      - name: Verify generated assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          test -s dist/snake.svg
          test -s dist/pacman-contribution-graph.svg
          test -s dist/light.svg
          test -s dist/dark.svg
          test -s dist/contribution-crawl-light.svg
          test -s dist/contribution-crawl-dark.svg
          test -s dist/profile-3d-contrib/profile-night-rainbow.svg
          test -s dist/metrics.svg
          test -s dist/github-profile-trophy.svg
          test -s dist/maeul-in-the-sky-dark.svg
          test -s dist/maeul-in-the-sky-light.svg
          test -s dist/ghstats/dracula/stats.svg
          test -s dist/ghstats/github_dark/stats.svg
          test -s dist/ghstats/tokyonight/stats.svg
          test -s dist/github-gravity.svg
          find dist -type f -maxdepth 3 -print

      - name: Publish all assets to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
